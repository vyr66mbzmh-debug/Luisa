<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" role="img"><title>Rod ending at pivot P on the right. From left to right the forces are 6 N upwards, 10 N downwards, 12 N upwards. Successive segment lengths from the left end to P are 2x m, 3x m, x m.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" fill="#254762"/></marker></defs><path d="M80 128 L655 128" fill="none" stroke="#254762" stroke-width="3" /><circle cx="655" cy="128" r="4" fill="#173650"/><text x="682" y="136" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">P</text><path d="M80 128 L80 53" fill="none" stroke="#254762" stroke-width="3" marker-end="url(#tip)"/><text x="80" y="40" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">6 N</text><text x="160.0" y="163" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">2x m</text><path d="M240 128 L240 216" fill="none" stroke="#254762" stroke-width="3" marker-end="url(#tip)"/><text x="240" y="248" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">10 N</text><text x="387.5" y="163" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">3x m</text><path d="M535 128 L535 53" fill="none" stroke="#254762" stroke-width="3" marker-end="url(#tip)"/><text x="535" y="40" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">12 N</text><text x="595.0" y="163" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">x m</text></svg>
