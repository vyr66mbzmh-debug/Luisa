<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" role="img"><title>Rod ending at pivot P on the right. From left to right the forces are 2 N upwards, 4 N downwards, 5 N upwards. Successive segment lengths from the left end to P are d, 2 m, 3 m.</title><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10z" fill="#254762"/></marker></defs><path d="M80 128 L655 128" fill="none" stroke="#254762" stroke-width="3" /><circle cx="655" cy="128" r="4" fill="#173650"/><text x="682" y="136" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">P</text><path d="M80 128 L80 53" fill="none" stroke="#254762" stroke-width="3" marker-end="url(#tip)"/><text x="80" y="40" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">2 N</text><text x="195.0" y="163" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">d</text><path d="M310 128 L310 216" fill="none" stroke="#254762" stroke-width="3" marker-end="url(#tip)"/><text x="310" y="248" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">4 N</text><text x="382.5" y="163" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">2 m</text><path d="M455 128 L455 53" fill="none" stroke="#254762" stroke-width="3" marker-end="url(#tip)"/><text x="455" y="40" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">5 N</text><text x="555.0" y="163" text-anchor="middle" fill="#163752" font-family="STIX Two Text,Georgia,serif" font-size="23">3 m</text></svg>
